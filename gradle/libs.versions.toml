[versions]
kotlin = "2.4.10"
shadow = "9.6.1"
gremlim = "0.0.9"

minestom = "2026.08.28-26.2"
coroutines = "1.11.0"
configurate = "1.0.0"
junit = "6.1.2"
log4j = "2.26.1"
slf4j = "2.0.18" # matches the version minestom ships with
terminal-console-appender = "1.3.0"
fastutil = "8.5.19"
gson = "2.14.0"
guava = "33.7.1-jre"
flare = "2.0.1" # matches the version minestom ships with
fabric-mixin = "0.17.3+mixin.0.8.7"
mixin-extra = "0.5.4"
asm = "9.10.1"
brigadier = "1.3.10"
polar = "1.16.0"
npc = "0.1.3"
adventure = "5.2.0" # matches the version minestom ships with
mini-placeholders = "3.2.0"

ksp = "2.3.10"
komapper = "7.0.0"
hikari = "7.0.2"
mariadb-jdbc = "3.5.8"
postgresql-jdbc = "42.7.13"
surf-database-r2dbc = "2.3.4"

luckperms-minestom = "5.5+26.2-SNAPSHOT" # substituted by the vendor/LuckPerms included build
spark = "1.10.181-SNAPSHOT" # substituted by the vendor/spark-minestom included build
guice = "7.0.0"
minestom-lobby-api = "1.0.0-SNAPSHOT" # plugin/extension contract the surf-*-minestom plugins implement

[libraries]
minestom = { module = "net.minestom:minestom", version.ref = "minestom" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
flare-fastutil = { module = "space.vectrix.flare:flare-fastutil", version.ref = "flare" }
fabric-mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "fabric-mixin" }
mixin-extra = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixin-extra" }
brigadier = { module = "com.mojang:brigadier", version.ref = "brigadier" }
polar = { module = "dev.hollowcube:polar", version.ref = "polar" }
npc = { module = "codes.bed.minestom:npc", version.ref = "npc" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }

configurate-yaml = { module = "dev.slne.forks.configurate:configurate-yaml", version.ref = "configurate" }
configurate-kotlin = { module = "dev.slne.forks.configurate:configurate-extra-kotlin", version.ref = "configurate" }

minestom-lobby-api = { module = "dev.slne.minestom.lobby:surf-minestom-lobby-api", version.ref = "minestom-lobby-api" }
guice = { module = "com.google.inject:guice", version.ref = "guice" }
guice-assistedinject = { module = "com.google.inject.extensions:guice-assistedinject", version.ref = "guice" }

surf-api-minestom = { module = "dev.slne.surf.api:surf-api-minestom", version = "+" }
surf-redis-minestom = { module = "dev.slne.surf.redis:surf-redis-minestom", version = "+" }
surf-rabbitmq-minestom = { module = "dev.slne.surf.rabbitmq:surf-rabbitmq-minestom", version = "+" }
surf-core-minestom = { module = "dev.slne.surf.core:surf-core-minestom", version = "+" }
surf-settings-minestom = { module = "dev.slne.surf.settings:surf-settings-minestom", version = "+" }
surf-punish-minestom = { module = "dev.slne.surf.punish:surf-punish-minestom", version = "+" }
surf-queue-minestom = { module = "dev.slne.surf.queue:surf-queue-minestom", version = "+" }
surf-playtime-minestom = { module = "dev.slne.surf.playtime:surf-playtime-minestom", version = "+" }
surf-bitmap-provider-common = { module = "dev.slne.surf.bitmap:surf-bitmap-provider-common", version = "+" }
surf-bitmap-provider-minestom = { module = "dev.slne.surf.bitmap:surf-bitmap-provider-minestom", version = "+" }
surf-ban-bypass-minestom = { module = "dev.slne.surf.bb:surf-ban-bypass-minestom", version = "+" }
surf-anticheat-minestom = { module = "dev.slne.minestom:surf-minestom-anticheat", version = "+" }

log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
terminal-console-appender = { module = "net.minecrell:terminalconsoleappender", version.ref = "terminal-console-appender" }

komapper-annotation = { module = "org.komapper:komapper-annotation", version.ref = "komapper" }
komapper-jdbc = { module = "org.komapper:komapper-jdbc", version.ref = "komapper" }
komapper-slf4j = { module = "org.komapper:komapper-slf4j", version.ref = "komapper" }
komapper-processor = { module = "org.komapper:komapper-processor", version.ref = "komapper" }

komapper-dialect-mariadb-jdbc = { module = "org.komapper:komapper-dialect-mariadb-jdbc", version.ref = "komapper" }
komapper-dialect-postgresql-jdbc = { module = "org.komapper:komapper-dialect-postgresql-jdbc", version.ref = "komapper" }

hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-jdbc" }
postgresql-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgresql-jdbc" }
surf-database-r2dbc = { module = "dev.slne.surf:surf-database-r2dbc", version.ref = "surf-database-r2dbc" }

luckperms-minestom = { module = "club.tesseract:luckperms-minestom", version.ref = "luckperms-minestom" }
spark-common = { module = "me.lucko:spark-common", version.ref = "spark" }
spark-minestom = { module = "me.lucko:spark-minestom", version.ref = "spark" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
gremlim = { id = "xyz.jpenilla.gremlin-gradle", version.ref = "gremlim" }

[bundles]
log4j = ["log4j-api", "log4j-core", "log4j-slf4j2-impl"]